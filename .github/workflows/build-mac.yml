name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      # 无证书构建：禁止 electron-builder 自动寻找签名身份
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # 跑道在海外，直接用 GitHub 源下载 Electron，比 npmmirror 快
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (electron-vite + electron-builder --mac)
        run: npm run build:mac

      - name: Show app signature status (ad-hoc expected)
        run: codesign -dv dist/mac*/DeskPet.app 2>&1 || true

      - name: Upload DMG & zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish to rolling release (fast direct download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: CI build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: |
            dist/*.dmg
            dist/*.zip
